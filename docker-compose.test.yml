# Extended docker-compose for testing
# Usage: docker-compose -f docker-compose.yml -f docker-compose.test.yml up

version: '3.8'

services:
  # Test runner service
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: limesurvey-client-tests
    environment:
      LIMESURVEY_TEST_URL: http://limesurvey
      LIMESURVEY_TEST_USER: admin
      LIMESURVEY_TEST_PASSWORD: admin123
    depends_on:
      limesurvey:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/target  # Persist Maven cache
    networks:
      - default
