services:
  limesurvey:
    image: martialblog/limesurvey:6-apache
    depends_on:
      - lime-db
    ports:
      - "8080:8080"
    environment:
      DB_TYPE: mysql
      DB_HOST: lime-db
      DB_PORT: 3306
      DB_NAME: limesurvey
      DB_USERNAME: limesurvey
      DB_PASSWORD: limesurvey
      ADMIN_USER: admin
      ADMIN_PASSWORD: password
      ADMIN_NAME: Administrator
      ADMIN_EMAIL: admin@example.com
      REMOTECONTROL_ENABLE: "true"
      REMOTECONTROL_JSON_RPC: "true"
      LIMESURVEY_URL_FORMAT: http://localhost:8080
    volumes:
      - ./lime-data/upload:/var/www/html/upload
    networks:
      - limesurvey-db

  lime-db:
    image: mariadb:11.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: limesurvey
      MYSQL_USER: limesurvey
      MYSQL_PASSWORD: limesurvey
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - limesurvey-db

volumes:
  db-data:

networks:
  limesurvey-db:
    driver: bridge